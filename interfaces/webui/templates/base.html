<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zenith Cosmo WebUI</title>

    <link
        rel="stylesheet"
        href="/static/css/webui.css"
    >
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">ZC</div>

                <div>
                    <div class="brand-title">Zenith Cosmo</div>
                    <div class="brand-subtitle">Observability</div>
                </div>
            </div>

            <nav class="nav">
                <a
                    href="/"
                    class="nav-link {% if active_page == 'dashboard' %}active{% endif %}"
                >
                    Dashboard
                </a>

                <a
                    href="/vision"
                    class="nav-link {% if active_page == 'vision' %}active{% endif %}"
                >
                    Vision
                </a>

                <a
                    href="/logs"
                    class="nav-link {% if active_page == 'logs' %}active{% endif %}"
                >
                    Logs
                </a>

                <a
                    href="/events"
                    class="nav-link {% if active_page == 'events' %}active{% endif %}"
                >
                    Events
                </a>

                <a
                    href="/memory"
                    class="nav-link {% if active_page == 'memory' %}active{% endif %}"
                >
                    Memory
                </a>

                <a
                    href="/conversations"
                    class="nav-link {% if active_page == 'conversations' %}active{% endif %}"
                >
                    Conversations
                </a>

                <a
                    href="/status"
                    class="nav-link {% if active_page == 'status' %}active{% endif %}"
                >
                    Status
                </a>
            </nav>

            <div class="sidebar-footer">
                Read-only interface
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                    <p class="page-subtitle">
                        {% block page_subtitle %}Runtime overview{% endblock %}
                    </p>
                </div>

                <div
                    id="topbar-status"
                    class="topbar-status"
                >
                    Connecting...
                </div>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/common.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
