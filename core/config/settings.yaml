system:
  name: Zenith Cosmo 42
  codename: ZC-42
  language: pt-BR
  debug: true

personality:
  enabled: true
  active_profile: "cosmo"
  profiles_path: "cosmo/cognition/personality/profiles"

llm:
  provider: "openrouter"
  model: "openai/gpt-oss-120b:free"
  temperature: 0.4
  max_tokens: 512
  timeout: 30

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 2048
  silence_threshold: 500
  silence_timeout: 1.5
  max_record_seconds: 30

wakeword:
  enabled: true
  words:
    - cosmo
    - cosmos
    - cosme
    - zenith
    - zênite
  energy_threshold: 250
  idle_sleep: 0.03

tts:
  engine: piper
  language: pt
  locale: pt_BR
  model: faber/medium/pt_BR-faber-medium
  voice: pt-br
  speed: 145
  pitch: 35
  volume: 120

vision:
  camera_index: 0
  width: 640
  height: 480
  grayscale: true

face_recognition:
  confidence_threshold: 70

memory:
  max_conversation_history: 20

database:
  path: data/database/cosmo.db

logs:
  level: DEBUG
  path: cosmo/data/logs/cosmo.log
  sqlite_enabled: true

webui:
  enabled: true
  host: 0.0.0.0
  port: 8765